name: Build Android AAB

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: read

jobs:
  bundle:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify internal-only AAB provenance
        shell: bash
        run: |
          # Automatic bundles are CI artifacts, not approved Play Store releases.
          test "${{ github.event_name }}" = "workflow_run"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.head_sha }}" = "$(git rev-parse HEAD)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          cp -r lib /tmp/flipwert_lib
          cp pubspec.yaml /tmp/flipwert_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipwert --project-name flipwert --no-pub
          rm -rf lib
          cp -r /tmp/flipwert_lib lib
          cp /tmp/flipwert_pubspec.yaml pubspec.yaml
          python3 tools/prepare_android_ci.py
          grep -q 'applicationId = "com.flipwert.app"' android/app/build.gradle.kts
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Verify release metadata
        shell: bash
        run: |
          grep -q '^version: 0.14.8+31$' pubspec.yaml

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify AAB
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Flipwert-V0.14.8-INTERNAL-TEST-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
