name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      public_release:
        description: Require the documented public-release approvals
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: flipwert-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V0.14.8 boundaries
        shell: bash
        run: |
          grep -q '^version: 0.14.8+31$' pubspec.yaml
          grep -q 'in_app_purchase: ^3.3.0' pubspec.yaml
          grep -q 'google_mobile_ads: ^9.1.0' pubspec.yaml
          grep -Rq --include='*.dart' 'e.live && roles.contains(e.role)' lib/
          grep -Rq --include='*.dart' 'status.isSandbox(source.id)' lib/
          grep -Rq --include='*.dart' 'class V13MarketConfidence' lib/
          grep -Rq --include='*.dart' 'Platform.isAndroid || Platform.isIOS' lib/
          grep -Rq --include='*.dart' 'if (shareSub != null) return;' lib/
          grep -Rq --include='*.dart' "ValueKey('v145-open-flips')" lib/
          grep -Rq --include='*.dart' "ValueKey('v145-clear-search')" lib/
          grep -Rq --include='*.dart' "ValueKey('v145-retry-sources')" lib/
          grep -Rq --include='*.dart' 'void _retryFailed()' lib/
          grep -Rq --include='*.dart' 'widget.onSearch(raw)' lib/
          grep -Rq --include='*.dart' 'maxLines: 3' lib/
          grep -q 'static Uri? sharedListingUrl' lib/source_registry.dart
          grep -Rq --include='*.dart' "ValueKey('kleinanzeigen-manual-price')" lib/
          grep -Rq --include='*.dart' "ValueKey('v147-remember-deal')" lib/
          grep -Rq --include='*.dart' "status == 'Saved'" lib/
          grep -Rq --include='*.dart' 'maxBuyAtCheck' lib/
          grep -Rq --include='*.dart' 'confidenceScore' lib/
          grep -Rq --include='*.dart' 'String v147AgeLabel' lib/
          grep -Rq --include='*.dart' 'v148PrioritizeSaved' lib/
          grep -Rq --include='*.dart' "ValueKey('v148-menu-" lib/
          grep -Rq --include='*.dart' "ValueKey('v151-buyback-condition')" lib/
          grep -Rq --include='*.dart' "ValueKey('v156-buyback-empty')" lib/
          grep -q "url.pathname === '/v1/listing/resolve'" server/handler.js
          grep -q 'listing_import_disabled' server/handler.js
          ! grep -Rq 'resolvePublicListing\|resolveSharedListing' server/
          ! grep -Rq --include='*.dart' 'resolvePublicListing\|resolveSharedListing' lib/
          test ! -e server/listing_resolver.js
          grep -q '^EBAY_ENV=sandbox$' server/.env.example
          ! grep -Rq --include='*.dart' 'unawaited(monetization.prepareAds())' lib/

      - name: Verify eBay credential isolation
        shell: bash
        run: |
          ! grep -R -E 'EBAY_(SANDBOX_)?CLIENT_(ID|SECRET)' lib pubspec.yaml
          ! grep -R -E 'api(\.sandbox)?\.ebay\.com' lib

      - name: Verify internal AAB artifact boundary
        shell: bash
        run: |
          grep -q 'name: Flipwert-V0.14.8-INTERNAL-TEST-AAB' .github/workflows/build-android-aab.yml
          ! grep -q 'name: Flipwert-V0.14.8-PLAY-AAB' .github/workflows/build-android-aab.yml
          grep -q 'Verify internal-only AAB provenance' .github/workflows/build-android-aab.yml
          grep -Fq "github.event.workflow_run.event == 'push'" .github/workflows/build-android-aab.yml
          grep -Eq 'test .*workflow_run.event.* = "push"' .github/workflows/build-android-aab.yml
          grep -q '^name: Build Android Play AAB$' .github/workflows/build-android-play-aab.yml
          grep -q 'name: Flipwert-V0.14.8-PLAY-UPLOAD-AAB-' .github/workflows/build-android-play-aab.yml
          grep -q 'Verify Play AAB provenance' .github/workflows/build-android-play-aab.yml
          grep -q 'jarsigner -verify -strict' .github/workflows/build-android-play-aab.yml
          grep -q 'FLIPWERT_ANDROID_UPLOAD_KEYSTORE_B64' .github/workflows/build-android-play-aab.yml

      - name: Check backend
        run: |
          npm --prefix server run check

      - name: Verify public release gate
        env:
          FLIPWERT_PUBLIC_RELEASE: ${{ inputs.public_release || 'false' }}
          FLIPWERT_OPERATOR_NAME: ${{ vars.FLIPWERT_OPERATOR_NAME }}
          FLIPWERT_OPERATOR_ADDRESS: ${{ vars.FLIPWERT_OPERATOR_ADDRESS }}
          FLIPWERT_OPERATOR_EMAIL: ${{ vars.FLIPWERT_OPERATOR_EMAIL }}
          FLIPWERT_PRIVACY_URL: ${{ vars.FLIPWERT_PRIVACY_URL }}
          FLIPWERT_TERMS_URL: ${{ vars.FLIPWERT_TERMS_URL }}
          FLIPWERT_LEGAL_REVIEWED_AT: ${{ vars.FLIPWERT_LEGAL_REVIEWED_AT }}
          FLIPWERT_LEGAL_REVIEW_ACK: ${{ vars.FLIPWERT_LEGAL_REVIEW_ACK }}
          FLIPWERT_SOURCE_RIGHTS_ACK: ${{ vars.FLIPWERT_SOURCE_RIGHTS_ACK }}
        run: |
          python3 tools/check_public_release_gate_test.py
          python3 tools/prepare_android_play_signing_test.py
          python3 tools/check_public_release_gate.py

      - name: Smoke test sandbox and disabled listing import
        shell: bash
        run: |
          PORT=8099 node server/index.js >/tmp/flipwert-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8099/health >/tmp/health.json && break
            sleep 0.25
          done
          grep -q '"ok":true' /tmp/health.json
          grep -q '"ebay_environment":"sandbox"' /tmp/health.json
          curl -fsS http://127.0.0.1:8099/v1/status >/tmp/status.json
          grep -q '"data_kind":"sandbox_mock_data"' /tmp/status.json
          code=$(curl -sS -o /tmp/resolve.json -w '%{http_code}' 'http://127.0.0.1:8099/v1/listing/resolve?url=https%3A%2F%2Fwww.kleinanzeigen.de%2Fs-anzeige%2Ffake%2F123')
          test "$code" = '410'
          grep -q 'listing_import_disabled' /tmp/resolve.json
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true

          EBAY_ENV=typo PORT=8100 node server/index.js >/tmp/flipwert-invalid-env.log 2>&1 &
          INVALID_PID=$!
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8100/health >/tmp/invalid-health.json && break
            sleep 0.25
          done
          grep -q '"ebay_environment":"sandbox"' /tmp/invalid-health.json
          kill $INVALID_PID
          wait $INVALID_PID 2>/dev/null || true

          EBAY_ENV=production PORT=8101 node server/index.js >/tmp/flipwert-production-env.log 2>&1 &
          PROD_PID=$!
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8101/health >/tmp/production-health.json && break
            sleep 0.25
          done
          grep -q '"ebay_environment":"production"' /tmp/production-health.json
          curl -fsS http://127.0.0.1:8101/v1/status >/tmp/production-status.json
          grep -q '"data_kind":"blocked_pending_rights"' /tmp/production-status.json
          grep -q '"rights_gate":"not_approved"' /tmp/production-status.json
          grep -q '"configured":false' /tmp/production-status.json
          kill $PROD_PID
          wait $PROD_PID 2>/dev/null || true

          EBAY_ENV=production \
          EBAY_CLIENT_ID=ci-placeholder \
          EBAY_CLIENT_SECRET=ci-placeholder \
          EBAY_SOURCE_RIGHTS_ACK=approved-ebay-api-use-and-display-v1 \
          KEEPA_API_KEY=ci-placeholder \
          KEEPA_SOURCE_RIGHTS_ACK=approved-keepa-price-use-and-display-v1 \
          PORT=8103 node server/index.js >/tmp/flipwert-approved-rights.log 2>&1 &
          RIGHTS_PID=$!
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8103/v1/status >/tmp/approved-rights-status.json && break
            sleep 0.25
          done
          node -e "const s=require('/tmp/approved-rights-status.json').sources; if(!s.ebay_de.configured||s.ebay_de.rights_gate!=='approved'||!s.amazon_de.configured||s.amazon_de.rights_gate!=='approved') process.exit(1)"
          kill $RIGHTS_PID
          wait $RIGHTS_PID 2>/dev/null || true

      - name: Verify eBay sandbox secret wiring
        shell: bash
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_SANDBOX_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_SANDBOX_CLIENT_SECRET }}
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo 'eBay sandbox repository secrets are not both configured; skipping wiring check.'
            exit 0
          fi
          EBAY_ENV=sandbox PORT=8102 node server/index.js >/tmp/flipwert-secret-wiring.log 2>&1 &
          SECRET_PID=$!
          trap 'kill $SECRET_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8102/v1/status >/tmp/secret-status.json && break
            sleep 0.25
          done
          grep -q '"configured":true' /tmp/secret-status.json
          grep -q '"environment":"sandbox"' /tmp/secret-status.json
          grep -q '"data_kind":"sandbox_mock_data"' /tmp/secret-status.json
          kill $SECRET_PID
          wait $SECRET_PID 2>/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          cp -r lib /tmp/flipwert_lib
          cp pubspec.yaml /tmp/flipwert_pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --org com.flipwert --project-name flipwert --no-pub
          rm -rf lib
          cp -r /tmp/flipwert_lib lib
          cp /tmp/flipwert_pubspec.yaml pubspec.yaml
          python3 tools/prepare_android_ci.py
          grep -q 'applicationId = "com.flipwert.app"' android/app/build.gradle.kts
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml

      - name: Configure persistent test APK signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          TEST_KEYSTORE_B64: ${{ secrets.FLIPWERT_TEST_KEYSTORE_B64 }}
          TEST_STORE_PASSWORD: ${{ secrets.FLIPWERT_TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.FLIPWERT_TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.FLIPWERT_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TEST_KEYSTORE_B64 TEST_STORE_PASSWORD TEST_KEY_ALIAS TEST_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required persistent test signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$TEST_KEYSTORE_B64" | base64 --decode > android/app/flipwert-test.jks
          chmod 600 android/app/flipwert-test.jks
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          code = path.read_text()
          anchor = '    buildTypes {'
          assert code.count(anchor) == 1
          assert 'signingConfig = signingConfigs.getByName("debug")' in code
          code = code.replace(anchor, '''
              signingConfigs {
                  create("persistentTest") {
                      storeFile = file("flipwert-test.jks")
                      storePassword = System.getenv("TEST_STORE_PASSWORD")
                      keyAlias = System.getenv("TEST_KEY_ALIAS")
                      keyPassword = System.getenv("TEST_KEY_PASSWORD")
                  }
              }
          ''' + anchor, 1)
          code = code.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("persistentTest")', 1)
          path.write_text(code)
          PY

      - name: Stamp monotonic Android test version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^version: \([^+]*\)+[0-9]*$/\1/p' pubspec.yaml)
          test -n "$version_name"
          echo "FLIPWERT_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "FLIPWERT_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Run critical regressions explicitly
        run: |
          flutter test test/v131_startup_test.dart
          flutter test test/v142_nonlive_market_guard_test.dart
          flutter test test/v143_market_quality_test.dart
          flutter test test/v144_market_confidence_test.dart
          flutter test test/v145_streamline_test.dart
          flutter test test/v146_kleinanzeigen_share_price_test.dart
          flutter test test/v147_deal_memory_test.dart
          flutter test test/v148_recheck_watchlist_test.dart
          flutter test test/v156_live_market_transparency_test.dart

      - name: Build release APK
        shell: bash
        env:
          FLIPWERT_PUBLIC_RELEASE: ${{ inputs.public_release || 'false' }}
          FLIPWERT_OPERATOR_NAME: ${{ vars.FLIPWERT_OPERATOR_NAME }}
          FLIPWERT_OPERATOR_ADDRESS: ${{ vars.FLIPWERT_OPERATOR_ADDRESS }}
          FLIPWERT_OPERATOR_EMAIL: ${{ vars.FLIPWERT_OPERATOR_EMAIL }}
          FLIPWERT_PRIVACY_URL: ${{ vars.FLIPWERT_PRIVACY_URL }}
          FLIPWERT_TERMS_URL: ${{ vars.FLIPWERT_TERMS_URL }}
          FLIPWERT_API_BASE: ${{ vars.FLIPWERT_API_BASE }}
          TEST_STORE_PASSWORD: ${{ secrets.FLIPWERT_TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.FLIPWERT_TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.FLIPWERT_TEST_KEY_PASSWORD }}
        run: |
          if [ "$FLIPWERT_PUBLIC_RELEASE" = "true" ]; then
            # The release gate has already validated these values. They are
            # public operator details, not credentials or secret tokens.
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              flutter build apk --release --build-name="$FLIPWERT_VERSION_NAME" --build-number="$FLIPWERT_VERSION_CODE" \
                --dart-define="FLIPWERT_OPERATOR_NAME=$FLIPWERT_OPERATOR_NAME" \
                --dart-define="FLIPWERT_OPERATOR_ADDRESS=$FLIPWERT_OPERATOR_ADDRESS" \
                --dart-define="FLIPWERT_OPERATOR_EMAIL=$FLIPWERT_OPERATOR_EMAIL" \
                --dart-define="FLIPWERT_PRIVACY_URL=$FLIPWERT_PRIVACY_URL" \
                --dart-define="FLIPWERT_TERMS_URL=$FLIPWERT_TERMS_URL" \
                --dart-define="FLIPWERT_API_BASE=$FLIPWERT_API_BASE"
            else
              flutter build apk --release \
                --dart-define="FLIPWERT_OPERATOR_NAME=$FLIPWERT_OPERATOR_NAME" \
                --dart-define="FLIPWERT_OPERATOR_ADDRESS=$FLIPWERT_OPERATOR_ADDRESS" \
                --dart-define="FLIPWERT_OPERATOR_EMAIL=$FLIPWERT_OPERATOR_EMAIL" \
                --dart-define="FLIPWERT_PRIVACY_URL=$FLIPWERT_PRIVACY_URL" \
                --dart-define="FLIPWERT_TERMS_URL=$FLIPWERT_TERMS_URL" \
                --dart-define="FLIPWERT_API_BASE=$FLIPWERT_API_BASE"
            fi
          else
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              flutter build apk --release --build-name="$FLIPWERT_VERSION_NAME" --build-number="$FLIPWERT_VERSION_CODE" \
                --dart-define="FLIPWERT_API_BASE=$FLIPWERT_API_BASE"
            else
              flutter build apk --release \
                --dart-define="FLIPWERT_API_BASE=$FLIPWERT_API_BASE"
            fi
          fi

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flipwert-V0.14.8-RECHECK-WATCHLIST-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish direct test APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk flipwert-test.apk
          commit_title=$(git log -1 --format=%s)
          short_sha=$(git rev-parse --short HEAD)
          timestamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          printf 'Built: %s\nCommit: %s (%s)\nversionName: %s\nversionCode: %s\n' \
            "$timestamp" "$commit_title" "$short_sha" "$FLIPWERT_VERSION_NAME" "$FLIPWERT_VERSION_CODE" > /tmp/flipwert-release-notes.txt
          if gh release view test-latest >/dev/null 2>&1; then
            gh release edit test-latest --prerelease --title "Flipwert latest test APK" --notes-file /tmp/flipwert-release-notes.txt
          else
            gh release create test-latest --prerelease --title "Flipwert latest test APK" --notes-file /tmp/flipwert-release-notes.txt --target "$GITHUB_SHA"
          fi
          gh release upload test-latest flipwert-test.apk --clobber
